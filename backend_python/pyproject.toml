[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-ml"
version = "0.1.0"
description = "Prediccion de agotamiento de inventario a 30 dias"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
inventory-ingest = "inventory_ml.ingestion.perfilado:main"
inventory-simulate = "inventory_ml.simulation.simulador:main"
inventory-train = "inventory_ml.training.train:main"
inventory-riesgo = "inventory_ml.reporting.riesgo:main"
inventory-evaluar = "inventory_ml.training.evaluar:main"
inventory-experimento = "inventory_ml.simulation.experimento:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
