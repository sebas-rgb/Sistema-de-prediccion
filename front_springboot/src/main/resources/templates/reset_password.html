<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña · Predicción de inventario · Austral Lens</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
</head>
<body class="min-h-screen">
<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <form id="formReset" th:action="@{/reset-password}" method="post" class="card w-full max-w-md space-y-5 p-6 sm:p-8">
        <input type="hidden" name="token" th:value="${token}"/>

        <div class="space-y-2 text-center">
            <img src="/images/logo.png" alt="Austral Lens" class="mx-auto h-14 object-contain">
            <h1 class="text-2xl font-bold text-slate-900">Crea una contraseña nueva</h1>
        </div>

        <div th:if="${error}" class="alert-error" role="alert" th:text="${error}"></div>
        <div th:if="${message}" class="alert-ok" role="status">
            <span th:text="${message}"></span>
            <a href="/" class="font-semibold underline">Iniciar sesión</a>
        </div>

        <div>
            <label for="password" class="label">Nueva contraseña</label>
            <input id="password" type="password" name="password" required minlength="6"
                   autocomplete="new-password" aria-describedby="passwordHint" class="field"/>
            <span id="passwordHint" class="hint">Mínimo 6 caracteres.</span>
        </div>

        <div>
            <label for="confirmPassword" class="label">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" name="confirmPassword" required minlength="6"
                   autocomplete="new-password" class="field"/>
        </div>

        <button type="submit" class="btn-primary w-full">Cambiar contraseña</button>
    </form>
</main>

<script>
    // Validación nativa: el navegador muestra el mensaje junto al campo
    document.getElementById("formReset").addEventListener("input", function () {
        const confirmar = document.getElementById("confirmPassword");
        confirmar.setCustomValidity(
            confirmar.value === document.getElementById("password").value ? "" : "Las contraseñas no coinciden."
        );
    });
</script>
</body>
</html>
