<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · Predicción de inventario · Austral Lens</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
</head>
<body class="min-h-screen">
<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <form id="formRegistro" th:action="@{/register}" method="post" th:object="${registerRequest}"
          class="card w-full max-w-2xl space-y-6 p-6 sm:p-8">

        <div class="space-y-2 text-center">
            <img src="/images/logo.png" alt="Austral Lens" class="mx-auto h-14 object-contain">
            <h1 class="text-2xl font-bold text-slate-900">Crear cuenta</h1>
            <p class="text-sm text-slate-600">Acceso al sistema de predicción de inventario</p>
        </div>

        <div th:if="${error != null}" class="alert-error" role="alert" th:text="${error}"></div>
        <div th:if="${errores != null and !errores.isEmpty()}" class="alert-error" role="alert">
            <p class="font-semibold">Revisa estos datos:</p>
            <ul class="mt-1 list-disc pl-5">
                <li th:each="e : ${errores}" th:text="${e}"></li>
            </ul>
        </div>

        <fieldset class="grid gap-4 sm:grid-cols-2">
            <legend class="mb-2 text-sm font-semibold text-slate-900">Datos personales</legend>

            <div class="sm:col-span-2">
                <label for="nombre" class="label">Nombre completo</label>
                <input th:field="*{nombre}" type="text" required autocomplete="name"
                       pattern="[\p{L} ]{3,110}" title="Solo letras y espacios, de 3 a 110 caracteres"
                       class="field"/>
            </div>

            <div>
                <label for="cedula" class="label">Cédula (C.C.)</label>
                <input th:field="*{cedula}" type="text" required inputmode="numeric" maxlength="12"
                       pattern="[0-9]{6,12}" aria-describedby="cedulaHint" class="field"/>
                <span id="cedulaHint" class="hint">Solo números, de 6 a 12 dígitos.</span>
            </div>

            <div>
                <label for="telefono" class="label">Teléfono</label>
                <input th:field="*{telefono}" type="tel" required inputmode="tel" autocomplete="tel"
                       pattern="[0-9]{1,15}" placeholder="3001234567" aria-describedby="telefonoHint" class="field"/>
                <span id="telefonoHint" class="hint">Solo números, sin espacios.</span>
            </div>
        </fieldset>

        <fieldset class="grid gap-4 sm:grid-cols-2">
            <legend class="mb-2 text-sm font-semibold text-slate-900">Dónde trabajas</legend>

            <div>
                <label for="ciudad" class="label">Ciudad</label>
                <select th:field="*{ciudad}" required class="field">
                    <option value="">Selecciona una ciudad</option>
                    <option th:each="c : ${ciudades}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>

            <div>
                <label for="punto" class="label">Área o punto de venta</label>
                <select th:field="*{punto}" required class="field">
                    <option value="">Selecciona un punto</option>
                    <option th:each="p : ${puntos}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="sm:col-span-2">
                <label for="cargo" class="label">Cargo</label>
                <select th:field="*{cargo}" required class="field">
                    <option value="">Selecciona un cargo</option>
                    <option th:each="c : ${cargos}" th:value="${c}" th:text="${c}"></option>
                </select>
            </div>
        </fieldset>

        <fieldset class="grid gap-4 sm:grid-cols-2">
            <legend class="mb-2 text-sm font-semibold text-slate-900">Acceso</legend>

            <div class="sm:col-span-2">
                <label for="email" class="label">Correo electrónico</label>
                <input th:field="*{email}" type="email" required autocomplete="email"
                       placeholder="nombre@australlens.com" class="field"/>
            </div>

            <div>
                <label for="password" class="label">Contraseña</label>
                <input th:field="*{password}" type="password" required minlength="6"
                       autocomplete="new-password" aria-describedby="passwordHint" class="field"/>
                <span id="passwordHint" class="hint">Mínimo 6 caracteres.</span>
            </div>

            <div>
                <label for="confirmPassword" class="label">Confirmar contraseña</label>
                <input th:field="*{confirmPassword}" type="password" required minlength="6"
                       autocomplete="new-password" class="field"/>
            </div>

            <label class="inline-flex items-center gap-2 text-sm text-slate-600 sm:col-span-2">
                <input type="checkbox" id="verPassword" class="accent-brand">
                Mostrar contraseñas
            </label>
        </fieldset>

        <label class="flex items-start gap-2 text-sm text-slate-700">
            <input type="checkbox" required class="mt-1 accent-brand">
            <span>Autorizo el tratamiento de mis datos personales según la política de privacidad
                y la ley de Habeas Data vigente en Colombia.</span>
        </label>

        <div class="flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
            <a href="/" class="link text-center text-sm">Ya tengo cuenta</a>
            <button type="submit" class="btn-primary">Crear cuenta</button>
        </div>
    </form>
</main>

<script>
    const pass = document.getElementById("password");
    const confirmar = document.getElementById("confirmPassword");

    document.getElementById("verPassword").addEventListener("change", function () {
        pass.type = confirmar.type = this.checked ? "text" : "password";
    });

    // Validación nativa: el navegador muestra el mensaje junto al campo
    document.getElementById("formRegistro").addEventListener("input", function () {
        confirmar.setCustomValidity(confirmar.value === pass.value ? "" : "Las contraseñas no coinciden.");
    });
</script>
</body>
</html>
