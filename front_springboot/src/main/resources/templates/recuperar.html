<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Predicción de inventario · Austral Lens</title>
    <link th:href="@{/main.css}" rel="stylesheet"/>
</head>
<body class="min-h-screen">
<main class="flex min-h-screen items-center justify-center px-4 py-10">
    <form th:action="@{/recover}" method="post" class="card w-full max-w-md space-y-5 p-6 sm:p-8">
        <div class="space-y-2 text-center">
            <img src="/images/logo.png" alt="Austral Lens" class="mx-auto h-14 object-contain">
            <h1 class="text-2xl font-bold text-slate-900">Recuperar contraseña</h1>
            <p class="text-sm text-slate-600">Te enviaremos un enlace para crear una nueva.</p>
        </div>

        <div th:if="${message}" class="alert-ok" role="status" th:text="${message}"></div>
        <div th:if="${error}" class="alert-error" role="alert" th:text="${error}"></div>

        <div>
            <label for="email" class="label">Correo electrónico</label>
            <input id="email" type="email" name="email" required autocomplete="email"
                   placeholder="nombre@australlens.com" class="field"/>
        </div>

        <button type="submit" class="btn-primary w-full">Enviar enlace</button>

        <p class="text-center text-sm"><a href="/" class="link">Volver a iniciar sesión</a></p>
    </form>
</main>
</body>
</html>
