<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/layout :: cabeza('Mi perfil')}"></th:block></head>
<body class="flex min-h-screen flex-col">

<header th:replace="~{fragments/layout :: barra('perfil')}"></header>

<main id="contenido" class="mx-auto w-full max-w-4xl flex-1 px-4 py-8 sm:px-6">
    <h1 class="mb-6 text-2xl font-bold text-slate-900">Mi perfil</h1>

    <dl class="card grid divide-y divide-slate-100 sm:grid-cols-2 sm:divide-y-0"
        th:with="u=${usuario}">
        <div class="p-4 sm:col-span-2 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Nombre completo</dt>
            <dd class="mt-1 text-lg font-semibold" th:text="${u?.nombre} ?: '—'"></dd>
        </div>
        <div class="p-4 sm:col-span-2 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Correo electrónico</dt>
            <dd class="mt-1 break-all font-medium" th:text="${u?.email} ?: '—'"></dd>
        </div>
        <div class="p-4 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Cédula</dt>
            <dd class="mt-1 font-medium tabular-nums" th:text="${u?.cedula} ?: '—'"></dd>
        </div>
        <div class="p-4 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Teléfono</dt>
            <dd class="mt-1 font-medium tabular-nums" th:text="${u?.telefono} ?: '—'"></dd>
        </div>
        <div class="p-4 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Cargo</dt>
            <dd class="mt-1 font-medium" th:text="${u?.cargo} ?: '—'"></dd>
        </div>
        <div class="p-4 sm:border-b sm:border-slate-100">
            <dt class="text-sm text-slate-500">Ciudad</dt>
            <dd class="mt-1 font-medium" th:text="${u?.ciudad} ?: '—'"></dd>
        </div>
        <div class="p-4">
            <dt class="text-sm text-slate-500">Punto</dt>
            <dd class="mt-1 font-medium" th:text="${u?.punto} ?: '—'"></dd>
        </div>
    </dl>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>
<th:block th:replace="~{fragments/layout :: asistente}"></th:block>
</body>
</html>
