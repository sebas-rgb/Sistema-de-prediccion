spring.application.name=back
server.port=81

# --- BASE DE DATOS EN ARCHIVO LOCAL (H2 PERSISTENTE) ---
# Se guarda en tu disco local. Cambia el path si prefieres otra ruta.
spring.datasource.url=jdbc:h2:file:${user.home}/.h2/testing_2;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# Fuerza a Spring Session a crear sus tablas en el archivo H2 si no existen
spring.session.jdbc.initialize-schema=always

# H2 Console (Entra a http://localhost:81/h2-console para ver tus tablas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate para H2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# --- SPRING SESSIONS EN MEMORIA ---
# Desactiva JDBC y usa la memoria RAM local del servidor web (no persiste sesiones, solo datos de BD)
spring.session.store-type=none
spring.session.timeout=90d

# --- Almacenamiento de archivos subidos (Local) ---
app.upload.dir=${user.home}/Documents/austral-uploads/

# URL base de la aplicacion
app.base-url=https://localhost:81

# Tamaños máximos de archivos permitidos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-part-count=200

# SSL / HTTPS
spring.ssl.bundle.pem.myhomelab.reload-on-update=true
server.ssl.bundle=mycert
spring.ssl.bundle.pem.mycert.keystore.certificate=file:cert/tickets.crt
spring.ssl.bundle.pem.mycert.keystore.private-key=file:cert/tickets.key

# CORREOS
